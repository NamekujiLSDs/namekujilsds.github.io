<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古戦場貢献度ランキング</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#09090b',
            surface: '#121215',
            card: '#18181b',
            muted: '#27272a',
            border: '#27272a',
            primary: '#3b82f6'
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ファビコン -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- 固有スタイルシート -->
  <link rel="stylesheet" href="style.css?v=20261124_02">
</head>
<body class="bg-background text-[#f4f4f5] min-h-screen px-4 py-6 md:px-8 md:py-10 font-sans antialiased selection:bg-[#3b82f6] selection:text-white relative">

  <div class="max-w-5xl mx-auto space-y-5">

    <!-- ヘッダー: ページタイトルと団員ID取得コードのコピーボタンのみに集約 -->
    <header class="flex flex-wrap items-center justify-between gap-3 pb-1">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2.5 text-[#f4f4f5]">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[#18181b] border border-[#27272a] shadow-sm">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
        </span>
        古戦場貢献度ランキング
      </h1>

      <button
        type="button"
        onclick="copyBookmarklet()"
        class="inline-flex items-center gap-2 h-9 px-3.5 rounded-md bg-[#18181b] hover:bg-[#27272a] border border-[#27272a] hover:border-[#3f3f46] text-xs font-medium text-[#d4d4d8] hover:text-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] focus-visible:ring-offset-2 focus-visible:ring-offset-background cursor-pointer select-none"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#a1a1aa]">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        団員ID取得コードをコピー
      </button>
    </header>

    <main class="space-y-5">
      <!-- 検索・取得フォームカード -->
      <section class="bg-[#18181b] rounded-xl border border-[#27272a] p-4 sm:p-5 shadow-sm">
        <div class="flex flex-col md:flex-row gap-3 md:items-end">
          <div class="w-full md:w-32 shrink-0">
            <label for="raidSelect" class="block text-xs font-medium text-[#a1a1aa] mb-1.5">開催回</label>
            <select
              id="raidSelect"
              class="w-full h-10 px-3 rounded-md bg-[#09090b] border border-[#27272a] hover:border-[#3f3f46] text-sm text-[#f4f4f5] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] focus-visible:border-[#3b82f6] transition-colors cursor-pointer"
            >
              <!-- JSで生成 -->
            </select>
          </div>

          <div class="flex-1 min-w-0">
            <label for="inputIds" class="block text-xs font-medium text-[#a1a1aa] mb-1.5">プレイヤーID</label>
            <input
              type="text"
              id="inputIds"
              autocomplete="off"
              spellcheck="false"
              class="w-full h-10 px-3 rounded-md bg-[#09090b] border border-[#27272a] hover:border-[#3f3f46] text-sm text-[#f4f4f5] placeholder:text-[#52525b] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] focus-visible:border-[#3b82f6] transition-colors font-mono"
              placeholder="12345678, 87654321"
            />
          </div>

          <button
            type="button"
            id="analyzeBtn"
            class="h-10 px-5 rounded-md bg-[#3b82f6] hover:bg-[#2563eb] active:bg-[#1d4ed8] disabled:bg-[#1e3a8a] disabled:text-[#93c5fd]/70 disabled:cursor-not-allowed text-white text-sm font-semibold transition-colors inline-flex items-center justify-center gap-2 whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] focus-visible:ring-offset-2 focus-visible:ring-offset-[#18181b] cursor-pointer"
          >
            <svg id="loadingIcon" aria-hidden="true" class="hidden animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
            <span id="btnText">ランキングを取得</span>
          </button>
        </div>

        <!-- エラー通知バー -->
        <div id="errorContainer" role="alert" class="hidden mt-3.5 px-3.5 py-2.5 bg-red-950/50 text-red-300 rounded-md flex items-center gap-2.5 text-sm border border-red-900/70">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-red-400">
            <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <p id="errorMsg"></p>
        </div>
      </section>

      <!-- ランキング結果テーブルカード -->
      <section id="resultSection" class="hidden bg-[#18181b] rounded-xl border border-[#27272a] shadow-sm overflow-hidden">
        <div class="px-4 py-3 bg-[#141417] border-b border-[#27272a] flex flex-wrap justify-between items-center gap-2.5">
          <div class="flex flex-wrap items-center gap-2">
            <h2 id="rankingTableHeading" class="font-semibold text-sm text-[#f4f4f5]">
              <span id="resultRaidBadge">ランキング</span>
            </h2>
            <span id="resultCountBadge" class="hidden inline-flex items-center px-2 py-0.5 rounded-full text-xs font-mono font-medium bg-[#27272a] text-[#d4d4d8]"></span>
            <span class="inline-flex items-center gap-1.5 text-xs font-mono text-[#71717a]">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span id="lastUpdate"></span>
            </span>
          </div>

          <button
            type="button"
            id="saveImageBtn"
            onclick="exportRankingImage()"
            disabled
            class="inline-flex items-center gap-1.5 h-8 px-3 text-xs font-medium rounded-md bg-[#18181b] hover:bg-[#27272a] disabled:opacity-40 disabled:pointer-events-none text-[#e4e4e7] hover:text-white border border-[#27272a] hover:border-[#3f3f46] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] focus-visible:ring-offset-2 focus-visible:ring-offset-[#141417] cursor-pointer select-none"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#60a5fa]">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            PNGを保存
          </button>
        </div>

        <progress id="streamProgress" class="stream-progress hidden w-full" value="0" max="1" aria-label="取得進捗"></progress>

        <div class="overflow-x-auto" role="region" aria-labelledby="rankingTableHeading" tabindex="0">
          <table class="w-full min-w-[720px] text-sm text-left whitespace-nowrap">
            <caption class="visually-hidden">古戦場貢献度ランキング一覧</caption>
            <thead class="bg-[#141417] text-xs font-medium text-[#a1a1aa] border-b border-[#27272a]">
              <tr>
                <th scope="col" class="px-3 py-3 w-11 text-center text-[#71717a]">#</th>
                <th scope="col" class="sortable-col w-28" data-sort-key="rank">
                  <button type="button" class="sort-btn justify-start" onclick="handleSort('rank')">
                    <span>全体順位</span>
                    <svg aria-hidden="true" class="sort-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                </th>
                <th scope="col" class="px-5 py-3">プレイヤー</th>
                <th scope="col" class="sortable-col text-right" data-sort-key="point" aria-sort="descending">
                  <button type="button" class="sort-btn justify-end" onclick="handleSort('point')">
                    <span>貢献度</span>
                    <svg aria-hidden="true" class="sort-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                </th>
                <th scope="col" class="sortable-col text-right" data-sort-key="realSpeed">
                  <button type="button" class="sort-btn justify-end" onclick="handleSort('realSpeed')">
                    <span class="flex flex-col items-end leading-tight">
                      <span>時速</span>
                      <span class="text-[11px] text-[#71717a] font-normal">1h / 20m</span>
                    </span>
                    <svg aria-hidden="true" class="sort-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                </th>
                <th scope="col" class="sortable-col text-right" data-sort-key="todayInc">
                  <button type="button" class="sort-btn justify-end" onclick="handleSort('todayInc')">
                    <span>当日増加</span>
                    <svg aria-hidden="true" class="sort-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                </th>
                <th scope="col" class="px-5 py-3 text-right">10万位差</th>
                <th scope="col" class="px-5 py-3 text-right">更新</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-[#27272a]">
              <!-- JSで動的にtr要素を生成 -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

  </div>

  <!-- グラフ詳細モーダルダイアログ -->
  <div id="chartModal" role="dialog" aria-modal="true" aria-labelledby="modalChartTitle" class="fixed inset-0 bg-black/80 backdrop-blur-[2px] hidden z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-[#18181b] rounded-xl shadow-2xl border border-[#27272a] w-full max-w-5xl h-[92vh] sm:h-[82vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">

      <!-- モーダルヘッダー -->
      <div class="p-3.5 sm:p-4 border-b border-[#27272a] flex flex-col gap-3 bg-[#141417]">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
              <line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <h2 id="modalChartTitle" class="font-semibold text-sm sm:text-base text-[#f4f4f5] truncate">推移グラフ</h2>
            <span id="modalChartTypeBadge" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-[#27272a] text-[#a1a1aa] shrink-0"></span>
          </div>

          <button
            type="button"
            onclick="closeChartModal()"
            aria-label="閉じる"
            class="inline-flex items-center justify-center w-8 h-8 rounded-md text-[#a1a1aa] hover:text-white bg-[#18181b] hover:bg-[#27272a] border border-[#27272a] hover:border-[#3f3f46] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] no-tap-highlight cursor-pointer"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- 期間切り替えタブ -->
        <div id="modalDateTabs" class="flex gap-1.5 overflow-x-auto w-full pb-0.5 scrollbar-hide touch-scroll no-tap-highlight">
          <!-- JSで動的に期間タブを生成 -->
        </div>

        <!-- 期間サマリーバー -->
        <div id="modalIncreaseSummary" class="flex flex-wrap items-center justify-between gap-2.5 px-3 py-2 rounded-lg bg-[#09090b] border border-[#27272a] text-xs sm:text-sm">
          <div class="flex items-center gap-2 shrink-0">
            <span id="summaryPhaseLabel" class="font-medium text-[#d4d4d8]">累計貢献度</span>
            <button
              type="button"
              id="summaryDetailToggle"
              aria-pressed="false"
              onclick="toggleSummaryNumber(event)"
              class="metric-toggle-btn inline-flex items-center gap-1 h-6 px-2 rounded border border-[#27272a] bg-[#18181b] hover:bg-[#27272a] text-[11px] font-medium text-[#a1a1aa] hover:text-[#f4f4f5] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3b82f6] cursor-pointer select-none"
            >
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
              実数値
            </button>
          </div>
          <div id="summaryValues" class="flex flex-wrap items-center gap-3 font-mono tabular-nums">
            <!-- JSで動的に生成 -->
          </div>
        </div>
      </div>

      <!-- グラフ描画キャンバス -->
      <div class="p-2.5 sm:p-4 flex-1 min-h-0 relative bg-[#1c1c1e]">
        <canvas id="detailChart"></canvas>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 right-6 bg-[#18181b] border border-[#3f3f46] text-[#f4f4f5] px-4 py-2.5 rounded-lg shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 text-xs sm:text-sm font-medium flex items-center gap-2">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg"></span>
  </div>

  <!-- スクリーンリーダー向けステータス通知領域 -->
  <p id="srStatus" role="status" class="visually-hidden"></p>

  <!-- アプリケーションロジック -->
  <script src="script.js?v=20261124_03"></script>
</body>
</html>
