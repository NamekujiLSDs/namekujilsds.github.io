<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    【団活スカウト文面マネージャー ファビコン】
    スカウト（団員募集・メッセージ・繋がり）を象徴するスタイリッシュなアイコン
  -->
  <defs>
    <linearGradient id="scoutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="scoutCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="scoutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ベース背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#scoutBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- スカウトメッセージ吹き出しシンボル -->
  <path d="M16 20 C 16 15.5, 19.5 12, 24 12 L 40 12 C 44.5 12, 48 15.5, 48 20 L 48 34 C 48 38.5, 44.5 42, 40 42 L 26 42 L 18 48 L 18 40 C 16.8 38.5, 16 36.4, 16 34 Z" 
        fill="url(#scoutCyan)" filter="url(#scoutGlow)" opacity="0.95"/>

  <!-- 吹き出し内の3つのドット / 接続シンボル -->
  <circle cx="26" cy="27" r="2.8" fill="#0b0f19"/>
  <circle cx="32" cy="27" r="2.8" fill="#0b0f19"/>
  <circle cx="38" cy="27" r="2.8" fill="#0b0f19"/>
</svg>
